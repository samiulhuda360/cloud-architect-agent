[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-architect-agent"
version = "1.0.0"
description = "An AI architect for Azure in New Zealand: live NZD pricing, data-residency checks, Well-Architected review and Terraform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "openai>=1.50",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "fastmcp>=2.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.16.10"]

[tool.setuptools]
packages = ["cloud_architect"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
