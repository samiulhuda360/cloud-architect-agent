[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-architect-agent"
version = "2.0.0"
description = "An AI cloud architect for Azure: live prices in your currency, data residency for any region, company-policy checks, diagrams and Terraform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "openai>=1.50",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "fastmcp>=2.10",
  "python-dotenv>=1.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.16.10"]

[tool.setuptools]
packages = ["cloud_architect"]

[tool.setuptools.package-data]
cloud_architect = ["data/*.json"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
